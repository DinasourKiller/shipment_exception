services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control_tower_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shipment_control_tower
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - control_tower_network

  postgres:
    image: postgres:16-alpine
    container_name: control_tower_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shipment_control_tower
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipment_control_tower"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - control_tower_network

volumes:
  postgres_data:
    driver: local

networks:
  control_tower_network:
    driver: bridge
